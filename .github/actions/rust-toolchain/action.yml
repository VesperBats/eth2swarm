# The ONE way a workflow installs Rust (adopted from Myotis,
# .github/actions/rust-toolchain, #734 there): the exact toolchain
# rust-toolchain.toml pins, set as rustup's default, plus any targets and
# components the job needs. Workflows must not use dtolnay/rust-toolchain
# directly: `@stable` installs whatever is current on the day of the run, so two
# runs of one commit could compile with different rustc versions.
#
# The install is rustup's MINIMAL profile (rustc with rustdoc, cargo, rust-std).
# A job that runs clippy or rustfmt must ask for it in `components`.
name: Rust toolchain (pinned)
description: Install the rustc version pinned in rust-toolchain.toml
inputs:
  targets:
    description: Comma-separated rustup targets to add
    required: false
    default: ''
  components:
    description: Comma-separated rustup components to add
    required: false
    default: ''
outputs:
  version:
    description: The installed toolchain, e.g. 1.99.1
    value: ${{ steps.pin.outputs.channel }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=rust-toolchain.toml::channel must be an exact x.y.z version (got '$channel')"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    # By commit, not @master: what installs the pinned rustc must not move
    # either. Moving it is a reviewed edit of this line, by hand: the commit is
    # untagged, so Dependabot does not propose it.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
