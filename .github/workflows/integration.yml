# Integration test against a real Swarm dev network.
#
# Starts bee-factory (5 Bee nodes + Anvil with the Swarm contracts) on the
# runner's Docker and runs scripts/e2e-bee-factory.sh: import blocks as SOCs
# through worker 1, read and verify them through the queen (p2p retrieval),
# check that bad anchors, owners and ranges are rejected, and check that the
# inspector (`ethswarm serve`) verifies a block and refuses a foreign Host.
#
# Block source: the stack's own Anvil chain (chain 1337). The zbox mainnet node
# the script uses by default is reachable only over Tailscale, not from GitHub.
# 4 epochs × 16 blocks keeps the run short; the early Anvil blocks carry the
# contract deployments, so bodies with transactions are covered.
#
# bee-factory comes from ci/bee-factory/package-lock.json (exact versions and
# integrity hashes, resolved from releases older than 2026-11-08, the day
# before the bee-js / Swarm Desktop supply-chain incident Myotis records in
# its dependabot.yml), installed with --ignore-scripts: it runs without the
# install scripts of cpu-features, protobufjs and ssh2.
#
# The stack: `start --tag v2.8.3` runs bee-factory's six prebuilt images
# (ethersphere/bee-factory-{blockchain,queen,worker-1..4}:v2.8.3; Anvil runs
# from the blockchain image). bee-factory pulls them by tag, and if any pull
# fails it silently falls back to cloning ethersphere/bee, building it and
# pulling ghcr.io/foundry-rs/foundry:latest — an unpinned stack that could still
# go green. So this workflow pulls the six images itself, BY DIGEST (multi-arch
# manifest lists, linux/amd64 included, checked 2026-11-16), tags them :v2.8.3
# (bee-factory skips an image already present), and fails unless bee-factory
# reports the prebuilt mode. Moving to another Bee tag means new digests here:
# `docker buildx imagetools inspect ethersphere/bee-factory-<name>:<tag>`.
name: integration

on:
  push:
    branches: [ "main" ]
    # The integration paths. The `changes` job below tests a PR against the
    # same list as a regex: change both together.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/e2e-bee-factory.sh"
      - "ci/bee-factory/**"
      - ".github/workflows/integration.yml"
      - ".github/actions/rust-toolchain/**"
  # Unscoped base branch, like ci.yml. Not path-filtered at the workflow level:
  # `integration result` is a required check of the merge queue, and a check
  # that never reports keeps a PR out of the queue. The `changes` job applies
  # the path filter instead, because the e2e run takes minutes and pulls
  # ~1.5 GB of images.
  pull_request:
  # The merge queue: the e2e test runs on every queued commit, whatever it
  # touches (`merge_group` takes no path filter), so the commit main becomes
  # has passed it with every PR ahead of it.
  merge_group:
  # Weekly: a registry or upstream change (a pinned digest deleted, Docker Hub
  # limits, the runner image) shows up here before a PR needs the job.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# A newer push cancels a PR's superseded run (one group per PR ref). Every other
# run (push to main, merge queue, schedule, manual) gets a group of its own, keyed by its run
# ID, so it is never cancelled or replaced: with a shared group GitHub cancels a
# *pending* run as soon as a newer one queues, even with cancel-in-progress
# false, and a merge commit could end up without a result (security-fixes.md
# step 7 checks them). Same block in ci.yml and integration.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a PR: does it touch the integration paths (the list under `push`)? The
  # checkout is GitHub's test merge of the PR into its base, so its first
  # parent is the base and the diff is what the PR changes. Any other event
  # runs the test.
  changes:
    name: integration paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a rename lists its old path too, as GitHub's `paths`
          # filter does. -z: NUL-separated and never quoted (a quoted path
          # would defeat the anchors below). Read from a file, not a pipe:
          # `grep -q` exits at the first match, and under pipefail the
          # writer's SIGPIPE would turn that match into "no".
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          tr '\0' '\n' < "$RUNNER_TEMP/changed"
          if grep -zqE \
              '^(src/|ci/bee-factory/|\.github/actions/rust-toolchain/)|^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|scripts/e2e-bee-factory\.sh|\.github/workflows/integration\.yml)$' "$RUNNER_TEMP/changed"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: bee-factory end-to-end
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BEE_TAG: v2.8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        # A queue run's ref (gh-readonly-queue/…) is never built again: a cache
        # saved there only evicts main's. Same in ci.yml.
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      # Test-only interpreter, floating on its major like Myotis's test lanes;
      # bee-factory needs Node >= 18.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - name: Install bee-factory (locked, no install scripts)
        run: npm ci --prefix ci/bee-factory --ignore-scripts --no-audit --no-fund

      # Before the stack starts, so the minutes it takes overlap with nothing
      # that could time out.
      - name: Build ethswarm
        run: cargo build --locked

      - name: Pull the bee-factory images by digest
        run: |
          set -euo pipefail
          while read -r name digest; do
            docker pull "ethersphere/bee-factory-$name@$digest"
            docker tag "ethersphere/bee-factory-$name@$digest" "ethersphere/bee-factory-$name:$BEE_TAG"
          done <<'EOF'
          blockchain sha256:64ff38a8bd39ac86dc6db7ec3f7d42dafb4a87afc423b5d64e4f4f58b44703a6
          queen sha256:9a4762ec73c4ec6e653f7b4ecb2dc95cb550de81ac7516456a3b04fc508cb058
          worker-1 sha256:80c34992f38c38a8d702bb5243b48ef525d00e2ce1a26d224b7fc5ac2ff49e91
          worker-2 sha256:d7769174afc78a57377b067560c75cb7faec09ea8266b3a829e6cd9ce27bee2c
          worker-3 sha256:b2b859cea56920608b6e72eec833e7cfad166731f906c9a2770c17d64d927c08
          worker-4 sha256:25fcebca325883d6ba48f2a80dfc3cc615a14d6e48d013cd930f416cf06c5985
          EOF

      - name: Start bee-factory (prebuilt images only)
        run: |
          set -euo pipefail
          ci/bee-factory/node_modules/.bin/bee-factory start --tag "$BEE_TAG" 2>&1 | tee "$RUNNER_TEMP/start.log"
          grep -q 'Pre-built images found' "$RUNNER_TEMP/start.log" \
            || { echo "::error::bee-factory did not use the digest-pinned prebuilt images (it fell back to building Bee); see the output above."; exit 1; }

      - name: End-to-end test
        env:
          ETH2SWARM_RPC: http://localhost:8545
          EPOCH_SIZE: "16"
          EPOCHS: "4"
        run: scripts/e2e-bee-factory.sh

      - name: Container state and logs (on failure)
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep '^bee-factory-'); do
            echo "::group::$c"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done

      - name: Stop bee-factory
        if: always()
        run: ci/bee-factory/node_modules/.bin/bee-factory stop || true

  # The one check of this workflow the merge queue requires. It runs on
  # always(): a skipped required check counts as passed, so a cancelled or
  # failed `changes` must fail here instead of letting a PR through. On a PR
  # outside the integration paths it passes with a notice; everywhere else it
  # needs the e2e test to have succeeded.
  result:
    name: integration result
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.e2e }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "::error::The path check ended '$CHANGES'."; exit 1
          fi
          # Fail closed: only an explicit `false` skips the test.
          if [ "$WANTED" = false ]; then
            echo "::notice::Nothing in the integration paths changed: no end-to-end run on this PR. The merge queue into main runs it (a part PR into a feature branch: the final PR's queue entry)."
            exit 0
          fi
          [ "$WANTED" = true ] || { echo "::error::The path check gave no answer (e2e='$WANTED')."; exit 1; }
          [ "$E2E" = success ] || { echo "::error::bee-factory end-to-end ended '$E2E'."; exit 1; }
